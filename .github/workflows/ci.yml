name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: App (typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # contracts/lib/ is gitignored, so install the libraries the same way
      # docs/README.md does, pinned to releases.
      - run: forge install --no-git openzeppelin/openzeppelin-contracts@v5.1.0 foundry-rs/forge-std@v1.9.4
      - run: forge test -vv
